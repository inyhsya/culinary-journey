<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galeri — RasaNusa</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Poppins:wght@400;500;600&display=swap">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <!-- NAVBAR -->
    <nav class="navbar navbar-expand-lg" id="navbar">
        <div class="container">
            <a class="navbar-brand" href="index.html">RasaNusa</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navMenu">
                <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" href="index.html">Beranda</a></li>
                <li class="nav-item"><a class="nav-link active" href="galeri.html">Galeri</a></li>
                <li class="nav-item"><a class="nav-link" href="wawasan.html">Wawasan</a></li>
                <li class="nav-item"><a class="nav-link" href="tentang-kami.html">Tentang Kami</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- GALERI -->
    <main id="galeri-page">
        <div class="container">

            <!-- Header -->
            <div class="page-header text-center">
                <span class="hero-tag">Eksplorasi</span>
                <h1>Galeri Hidangan Nusantara</h1>
                <p class="hero-desc">36 hidangan dari 6 wilayah Indonesia</p>
            </div>

            <!-- Filter wilayah -->
            <div class="galeri-filter text-center">
                <button class="filter-btn active" onclick="filterGaleri('semua')">Semua</button>
                <button class="filter-btn" onclick="filterGaleri('sumatra')">Sumatra</button>
                <button class="filter-btn" onclick="filterGaleri('jawa')">Jawa</button>
                <button class="filter-btn" onclick="filterGaleri('kalimantan')">Kalimantan</button>
                <button class="filter-btn" onclick="filterGaleri('sulawesi')">Sulawesi</button>
                <button class="filter-btn" onclick="filterGaleri('bali-ntt')">Bali & NTT</button>
                <button class="filter-btn" onclick="filterGaleri('maluku-papua')">Maluku & Papua</button>
            </div>

            <!-- Grid -->
            <div class="galeri-grid" id="galeri-grid">
                <!-- Diisi oleh JavaScript -->
            </div>
        </div>
    </main>

    <!-- FOOTER -->
    <footer id="footer">
        <div class="container text-center">
            <p class="footer-brand">RasaNusa</p>
            <p class="footer-team">Ney - Dobies - Harun</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/journey.js"></script>
    <script>
    function renderGaleri(filter = 'semua') {
        const grid = document.getElementById('galeri-grid');
        grid.innerHTML = '';

        const courseLabel = {
            'appetizer': 'Appetizer',
            'mainCourse': 'Main Course',
            'dessert': 'Dessert'
        };

        const wilayahLabel = {
            'sumatra': 'Sumatra',
            'jawa': 'Jawa',
            'kalimantan': 'Kalimantan',
            'sulawesi': 'Sulawesi',
            'bali-ntt': 'Bali & NTT',
            'maluku-papua': 'Maluku & Papua'
        };

        Object.keys(dataHidangan).forEach(wilayah => {
            if (filter !== 'semua' && filter !== wilayah) return;

            Object.keys(dataHidangan[wilayah]).forEach(course => {
                dataHidangan[wilayah][course].forEach(hidangan => {
                    const card = document.createElement('div');
                    card.className = 'galeri-card';
                    card.dataset.wilayah = wilayah;
                    card.innerHTML = `
                    <div class="galeri-card-img-wrap">
                        <img src="${hidangan.foto}" alt="${hidangan.nama}">
                        <span class="galeri-course-badge">${courseLabel[course]}</span>
                    </div>
                    <div class="galeri-card-body">
                        <h3>${hidangan.nama}</h3>
                        <p class="galeri-asal">${hidangan.asal}</p>
                        <span class="galeri-wilayah-badge">${wilayahLabel[wilayah]}</span>
                    </div>
                    `;
                    grid.appendChild(card);
                });
            });
        });
    }

        function filterGaleri(wilayah) {
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            renderGaleri(wilayah);
        }

        renderGaleri();
    </script>
</body>
</html>
